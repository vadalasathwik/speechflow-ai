[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "speechflow-ai-backend"
version = "0.1.0"
description = "Backend API for SpeechFlow AI"
requires-python = ">=3.13,<3.14"
dependencies = ["alembic>=1.14,<2.0", "av>=12.3,<16.0", "fastapi>=0.115,<1.0", "faster-whisper>=1.1,<2.0", "numpy>=2.0,<3.0", "psycopg[binary]>=3.2,<4.0", "pydantic-settings>=2.6,<3.0", "python-multipart>=0.0.18,<1.0", "sqlalchemy>=2.0,<3.0", "uvicorn[standard]>=0.32,<1.0"]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1.0", "pytest>=8.3,<9.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
